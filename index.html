<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">A LITTLE FRIENDLY COMPETITION</p>
    <h1>Tic<span> Tac </span>Toe</h1>
    <p class="subtitle">Two players. Nine squares. Your move.</p>
    <section class="game" aria-label="Tic tac toe game">
      <div class="players"><span id="player-x" class="active">✕ <small>PLAYER ONE</small></span><span id="player-o">○ <small>PLAYER TWO</small></span></div>
      <p id="status" role="status" aria-live="polite">X’s turn</p>
      <div class="board" aria-label="Game board">
        <button class="cell" aria-label="Row 1, column 1, empty"></button>
        <button class="cell" aria-label="Row 1, column 2, empty"></button>
        <button class="cell" aria-label="Row 1, column 3, empty"></button>
        <button class="cell" aria-label="Row 2, column 1, empty"></button>
        <button class="cell" aria-label="Row 2, column 2, empty"></button>
        <button class="cell" aria-label="Row 2, column 3, empty"></button>
        <button class="cell" aria-label="Row 3, column 1, empty"></button>
        <button class="cell" aria-label="Row 3, column 2, empty"></button>
        <button class="cell" aria-label="Row 3, column 3, empty"></button>
      </div>
      <button id="restart">↻ &nbsp; New game</button>
    </section>
    <p class="footer">Take turns placing X and O. Get three in a row to win.</p>
  </main>
</body>
</html>
